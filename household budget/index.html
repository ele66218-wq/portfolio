<!DOCTYPE html>
  <html>
    <head>
      <title>household budget</title>
      <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
     <div id="entryPage">
       <div class="container">
         <p>日付</p>
         <input id="date" type="date">
       </div>
       <div class="container">
         <p>メモ</p>
         <input type="text" placeholder="入力">
       </div>
       <div class="container">
         <p>支出</p>
         <input id="money" type="text" placeholder="金額を入力">
       </div>
       <h1 id="category">カテゴリー</h1>
       <div id="categoryBtns">
         <button>食費</button>
         <button>日用品</button>
         <button>衣服</button>
         <button>美容</button>
         <button>交際費</button>
         <button>医療費</button>
         <button>教育費</button>
         <button>高熱水道費</button>
         <button>交通費</button>
         <button>通信費</button>
         <button>その他</button>
         <button>編集・追加</button>
       </div>
       <button id=entryBudget>記録</button>
     </div>

     <div id="calendarPage" style="display: none;">
       <ul id="list">
        <li></li>
       </ul>
     </div>
     <div id="reportsPage" style="display: none;">
      <h1></h1>
     </div>
     <div id="budgetPage" style="display: none;">
      <h1></h1>
     </div>
     <div id="settingsPage" style="display: none;">
      <h1></h1>
     </div>
     <div class="nav">
       <button id="entryBtn">入力</button>
       <button id="calendarBtn">カレンダー</button>
       <button id="reportsBtn">レポート</button>
       <button id="budgetBtn">予算</button>
       <button id="settingsBtn">設定</button>
     </div>
    <script src="script.js"></script>
    </body>
  </html>
